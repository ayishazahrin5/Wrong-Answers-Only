/* ===============================
   CHAOTIC CANDY THEME
   =============================== */

:root {
    --purple: #211A3C;

    --yellow: #FFE45E;
    --cyan: #5CE1E6;
    --lime: #B8F35A;
    --cream: #FFF8E7;
    --dark-pink: #D9367A;
}

/* ===============================
   GENERAL
   =============================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: var(--purple);
    color: var(--cream);
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.screen {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hidden {
    display: none !important;
}

button {
    font-family: inherit;

/* ===============================
   INTRO
   =============================== */

#intro-screen {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--purple);
    overflow: hidden;
}

#intro-title {
    color: var(--pink);
    font-size: 5rem;
    font-weight: 900;
    margin: 0;
    white-space: nowrap;

    animation: introZoom 3s ease-in forwards;

    text-shadow:
        6px 6px 0 var(--yellow),
        12px 12px 0 var(--cyan);
}

@keyframes introZoom {

    0% {
        transform: scale(0.4);
        opacity: 1;
    }

    70% {
        transform: scale(1.8);
        opacity: 1;
    }

    100% {
        transform: scale(7);
        opacity: 0;
    }
}

   GIF SCREEN

#gif-screen {
    background: var(--yellow);
}

    padding: 20px;
}

}

    padding: 30px;

}

.choice:hover {
    transform: translate(-5px, -5px) rotate(-2deg);

        15px 15px 0 var(--lime);
}

.choice:active {
    transform: translate(5px, 5px);

}

.choice img {
    width: 100%;

}

.or {

/* ===============================

    padding: 25px;
}

   <script>

/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

function initAudio() {

    if (!audioCtx) {
        audioCtx =
            new (window.AudioContext ||
                window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function playSound(type) {

    initAudio();

    const now = audioCtx.currentTime;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);


    /* CLICK */

    if (type === "click") {

        oscillator.frequency.setValueAtTime(
            500,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            800,
            now + 0.08
        );

        gain.gain.setValueAtTime(
            0.15,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.1
        );

        oscillator.start(now);
        oscillator.stop(now + 0.1);
    }


    /* WIN */

    if (type === "win") {

        oscillator.type = "square";

        oscillator.frequency.setValueAtTime(
            400,
            now
        );

        oscillator.frequency.setValueAtTime(
            600,
            now + 0.12
        );

        oscillator.frequency.setValueAtTime(
            900,
            now + 0.24
        );

        gain.gain.setValueAtTime(
            0.18,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.45
        );

        oscillator.start(now);
        oscillator.stop(now + 0.45);
    }


    /* LOSE */

    if (type === "lose") {

        oscillator.type = "sawtooth";

        oscillator.frequency.setValueAtTime(
            500,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            80,
            now + 0.5
        );

        gain.gain.setValueAtTime(
            0.22,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.5
        );

        oscillator.start(now);
        oscillator.stop(now + 0.5);
    }


    /* TIMER */

    if (type === "tick") {

        oscillator.frequency.setValueAtTime(
            800,
            now
        );

        gain.gain.setValueAtTime(
            0.08,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.05
        );

        oscillator.start(now);
        oscillator.stop(now + 0.05);
    }


    /* AI */

    if (type === "ai") {

        oscillator.type = "triangle";

        oscillator.frequency.setValueAtTime(
            300,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            700,
            now + 0.15
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            250,
            now + 0.3
        );

        gain.gain.setValueAtTime(
            0.12,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.3
        );

        oscillator.start(now);
        oscillator.stop(now + 0.3);
    }

}

}

}, 3000);


/* =========================================================
   YOU PLAY
========================================================= */

const questions = [

    "What do cows drink?",
    "What color is the sky?",
    "What is 2 + 2?",
    "What do fish live in?",
    "What animal says meow?",
    "How many legs does a dog have?",
    "What do you use to see?",
    "What planet do we live on?",
    "What do birds use to fly?",
    "What is the opposite of hot?",
    "What fruit is yellow and curved?",
    "What do you wear on your feet?",
    "What do bees make?",
    "What animal is known as man's best friend?",
    "What do you use to write?",
    "What is frozen water called?",
    "What do chickens lay?",
    "What do you use to tell time?",
    "What shape has three sides?",
    "What is the capital of France?",
    "What do you use to cut paper?",
    "What do humans breathe?",
    "What is the largest ocean?",
    "What animal has a long trunk?",
    "What do you use to brush your teeth?",
    "What color are bananas usually?",
    "How many days are in a week?",
    "What do plants need from the sun?",
    "What animal says moo?",
    "What is 10 minus 5?",
    "What do you drink when you are thirsty?",
    "What flies in the sky?",
    "What do you sleep on?",
    "What animal has stripes and looks like a horse?",
    "What comes after Monday?"

];


let currentQuestion = "";

let timerInterval = null;

let timeLeft = 20;

let gameActive = false;


/* START GAME */

function startYouPlay() {

    stopGame();

    showScreen("you-screen");

    currentQuestion =
        questions[
            Math.floor(
                Math.random() *
                questions.length
            )
        ];

    document
        .getElementById("question")
        .textContent =
            currentQuestion;

    document
        .getElementById("heard-text")
        .textContent =
            "say your wrong answer...";

    startTimer();

}


/* TIMER */

function startTimer() {

    clearInterval(timerInterval);

    timeLeft = 20;

    gameActive = true;

    updateTimer();

    timerInterval =
        setInterval(() => {

            timeLeft--;

            updateTimer();


            if (
                timeLeft <= 5 &&
                timeLeft > 0
            ) {

                playSound("tick");

            }


            if (timeLeft <= 0) {

                clearInterval(timerInterval);

                loseGame();

            }

        }, 1000);

}


function updateTimer() {

    document
        .getElementById("timer")
        .textContent =
            timeLeft;

}


/* STOP GAME */

function stopGame() {

    clearInterval(timerInterval);

    gameActive = false;

    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {}

    }

}


/* =========================================================
   SPEECH RECOGNITION — YOU PLAY
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    recognition.onstart = () => {

        document
            .getElementById("heard-text")
            .textContent =
                "listening... 🎤";

    };


    recognition.onresult =
        (event) => {

            let liveText = "";

            let finalText = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0]
                        .transcript;


                if (
                    event.results[i]
                        .isFinal
                ) {

                    finalText +=
                        transcript;

                } else {

                    liveText +=
                        transcript;

                }

            }


            if (liveText) {

                document
                    .getElementById(
                        "heard-text"
                    )
                    .textContent =
                        `"${liveText}" 🎤`;

            }


            if (finalText) {

                document
                    .getElementById(
                        "heard-text"
                    )
                    .textContent =
                        `"${finalText}"`;

                checkAnswer(
                    finalText
                );

            }

        };


    recognition.onerror =
        (event) => {

            console.log(
                "Speech error:",
                event.error
            );


            if (!gameActive) {
                return;
            }


            if (
                event.error ===
                "no-speech"
            ) {

                loseGame();

            } else {

                document
                    .getElementById(
                        "heard-text"
                    )
                    .textContent =
                        "couldn't hear that 😭";

            }

        };


    recognition.onend = () => {

        console.log(
            "Speech recognition ended"
        );

    };

}

    return text
        .toLowerCase()
        .replace(
            /[^\w\s]/g,
            ""
        )
        .trim();

}

/* CHECK ANSWER */

function checkAnswer(answer) {

    if (!gameActive) {
        return;
    }


    const normalizedAnswer =
        normalize(answer);


    const correctAnswers =
        getCorrectAnswers(
            currentQuestion
        );


    const isCorrect =
        correctAnswers.some(
            correct =>
                normalizedAnswer
                    .includes(
                        normalize(correct)
                    )
        );


    if (isCorrect) {

        loseGame();

    } else {

        winGame();

    }

}

/* START ME PLAY */

function startMePlay() {

    showScreen(
        "me-screen"
    );

    questionInput.value = "";

    statusText.textContent =
        "ask me anything...";

    answerBox.classList.add(
        "hidden"
    );

    askAgainButton.classList.add(
        "hidden"
    );

}


/* ASK AI */

async function askWrongAnswer() {

    const question =
        questionInput.value.trim();


    if (!question) {

        statusText.textContent =
            "Ask me something first 😭";

        return;

    }


    statusText.textContent =
        "thinking of the worst possible answer...";


    playSound("ai");


    answerBox.classList.add(
        "hidden"
    );

    askAgainButton.classList.add(
        "hidden"
    );


    askButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        const response =
            await fetch(
                "/api/wrong-answer",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Something went wrong."
            );

        }


        answerText.textContent =
            data.answer;


        answerBox.classList.remove(
            "hidden"
        );


        askAgainButton.classList.remove(
            "hidden"
        );


        statusText.textContent =
            "there. definitely correct. trust me.";

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "oops: " +
            error.message;

    }


    askButton.disabled =
        false;

    micButton.disabled =
        false;

}


/* ASK BUTTON */

askButton.addEventListener(
    "click",
    () => {

        playSound("click");

        askWrongAnswer();

    }
);


/* ASK AGAIN */

askAgainButton.addEventListener(

    () => {

        playSound("click");

        answerBox.classList.add(

        );

        askAgainButton.classList.add(

        );

);

    meRecognition.lang =

    meRecognition.continuous =
        false;

    meRecognition.interimResults =
        false;


    meRecognition.onstart =
        () => {

            statusText.textContent =
                "listening... 🎤";

        };


    meRecognition.onresult =
        (event) => {

            const transcript =
                event.results[0][0]
                    .transcript;

            questionInput.value =
                transcript;

            statusText.textContent =
                "got it 😭";

        };


    meRecognition.onerror =
        (event) => {

            console.log(
                "ME PLAY speech error:",
                event.error
            );

            statusText.textContent =
                "couldn't hear you 😭";

        };

}
